service: wish-wall-next

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  region: ${env:REGION, 'ap-northeast-1'}
  stage: ${opt:stage, 'prod'}
  environment:
    DYNAMODB_TABLE: ${env:DYNAMODB_TABLE, 'Wishes'}
    REGION: ${env:REGION, 'ap-northeast-1'}
    ALLOWED_ORIGIN: ${env:ALLOWED_ORIGIN, '*'}
    USE_IN_MEMORY_DB: 'false'

functions:
  app:
    handler: .next/standalone/server.handler
    events:
      - httpApi:
          path: /{proxy+}
          method: ANY
  releaseWishes:
    handler: scripts/release-wishes.handler
    events:
      - schedule:
          rate: cron(0 16 16 2 ? 2026)

resources:
  Resources:
    WishesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${env:DYNAMODB_TABLE, 'Wishes'}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: wishId
            AttributeType: S
          - AttributeName: userId
            AttributeType: S
          - AttributeName: status
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: N
        KeySchema:
          - AttributeName: wishId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: UserIdIndex
            KeySchema:
              - AttributeName: userId
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: StatusCreatedAtIndex
            KeySchema:
              - AttributeName: status
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
